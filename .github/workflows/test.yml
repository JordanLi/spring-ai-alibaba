# spring-ai-alibaba-admin 子项目的构建 + 测试流水线。
# 说明：admin 子项目是一个独立的 Maven reactor（未挂在仓库根 pom 的 <modules> 下），
# 根工作流 build-and-test.yml 跑不到它，因此单独建此 workflow 兜底。
#
# 当前测试套件全部为纯单元 / Characterization 测试（Mockito，无 @SpringBootTest /
# Testcontainers），不依赖任何中间件，所以这里只做 build + test，跑得快也更稳。
#
# 待将来补上需要真实 DB/ES/RocketMQ 的集成测试（test-plan 的 B5 等）时，再按需用
# docker-compose.dev.yml 把中间件挂回来。届时注意 RocketMQ broker 在全新命名卷
# (rmq_store) 上以 user 3000:3000 启动会因卷属主为 root 而初始化失败
# （BrokerStartup.createBrokerController 失败 -> shutdown 时抛 ScheduleMessageService NPE），
# 需要先 chown 卷或改用容器内置存储路径。
name: 🧪 Admin Test

# 触发：推送到任意分支 + 任何指向本仓库的 PR
on:
  push:
  pull_request:

# 只读权限即可（仅跑测试 + 传 artifact）
permissions:
  contents: read

# 同一分支/PR 的新提交取消仍在跑的旧任务，省时省资源
concurrency:
  group: admin-test-${{ github.ref }}
  cancel-in-progress: true

# 所有 `run` 步骤默认在 admin 子目录执行
defaults:
  run:
    working-directory: spring-ai-alibaba-admin

jobs:
  build-and-test:
    name: Build & Test (JDK 17)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 对应 pom.xml 里的 <java.version>17</java.version>；内置 Maven 依赖缓存（~/.m2，按 pom.xml 哈希作 key）
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 核心步骤：mvn clean test。任一测试失败 -> 步骤失败 -> job 失败 -> 该检查变红。
      # 把此检查设为分支保护的 required check，即可“失败就 block merge”（见文件末尾说明）。
      - name: Run mvn clean test
        run: mvn -B -ntp clean test

      # 无论成败都收集测试报告到 artifact 区，方便 review（surefire 的 .txt/.xml）
      - name: Upload test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: |
            spring-ai-alibaba-admin/**/target/surefire-reports/**
          retention-days: 7
          if-no-files-found: warn
